    # the page's inline csod.context ("token":"...") plus endpoints.cloud ("https://uk.api.csod.com/").
    # The career page itself uses this token. It expires after a few hours, so fetch a fresh one each run.
    # Search: POST {cloud}rec-job-search/external/jobs with headers Authorization: Bearer {token}, Content-Type: application/json
