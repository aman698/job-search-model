  # Job_Url points to jobs.smartrecruiters.com/Nagarro1/<id>. The SmartRecruiters API ({type: smartrecruiters, id: "Nagarro1"})
  # also works, but it still lists stale 2023-24 postings, so the careers feed is the better source.
