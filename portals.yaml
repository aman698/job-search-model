  # ======================= IT / ER&D services + Samsung R&D =======================
  # portals_D.yaml - recipes for agent D's companies (verified 2026-11-13 with python requests through v2/job_checker.py fetchers)
  # Uses the json_api extensions: items with '*' and page start 0.

  # verified 2026-11-13: SuccessFactors CSB JSON API (the call careers.hcltech.com/search/ makes) works without a CSRF token.
  # Its 'location' param does not filter (Noida -> 0), so search by keyword and let the script filter on custprimecity.
  # Keyword search is full-text: embedded=528, firmware=247, AUTOSAR=11, BSP=16 jobs worldwide (10 per page).
  # Job page = https://careers.hcltech.com/job/{urlTitle}/{id}-en_US/ (city is also in the JD header line).
  "HCLTech (Engineering & R&D Services)":
    type: json_api
    method: POST
    url: "https://careers.hcltech.com/services/recruiting/v1/jobs"
    json:
      locale: "en_US"
      pageNumber: "{page}"
      sortBy: ""
      keywords: "{term}"
      location: ""
      facetFilters: {}
      brand: ""
      skills: []
      categoryId: 0
      alertId: ""
      rcmCandidateId: ""
    headers: {Accept: "application/json", Content-Type: "application/json"}
    terms: ["embedded", "firmware", "AUTOSAR", "BSP"]
    items: "jobSearchResult.*.response"
    fields:
      title: "unifiedStandardTitle"
      location: "custprimecity"       # e.g. "Noida", "Gautam Buddha Nagar", "Gurugram"; empty for some India-wide roles
      posted: "unifiedStandardStart"  # e.g. "11/3/26" (M/D/YY)
    url_template: "https://careers.hcltech.com/job/{urlTitle}/{id}-en_US/"
    page: {start: 0, step: 1, max: 60}

