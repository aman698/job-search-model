  # verified 2026-11-13: POST form job_type=all returns {"status":true,"data":[65 jobs]}; the site's own new-openings page calls this.
  # NOTE: for old (2021) records `title` is generic ("Sr Engineer") and the role is in `short_role`; key skills in `key_skills`.
  "VVDN Technologies":
    type: json_api
    method: POST
    url: "https://www.vvdntech.com/newsroom/careers_and_jobs/get_jobs"
    data: {job_type: "all"}          # extension: form-encoded body
    headers: {Accept: "application/json"}
    terms: [""]
    items: "data"
    fields:
      title: ["title", "short_role"]
      location: "job_location"       # comma-separated, e.g. "Gurgaon,Manesar"
      posted: "created_at"
      desc: "description"
      exp_min: "experience_min"
      exp_max: "experience_max"
    url_template: "https://www.vvdntech.com/careers/lateral-registration?job_id={job_id}"

  # verified 2026-11-13: Zwayam search (called by careers.hsc.com/hsc/) returns totalCount=11, 10 per page.
  # hsc.com itself is behind a Cloudflare challenge. Hughes India (hughes.in) careers is email-only; EchoStar (Jibe) had 0 NCR embedded.
  # companyId must be the base64 string "MTUzNjY=" (=15366). paginationStartNo inside filterCri = offset (0, 10, 20...).
  "Hughes Systique / Hughes India":
    type: json_api
    method: POST
    url: "https://public.zwayam.com/jobs/search"
    data:                            # extension: form-encoded body (multipart also works)
      filterCri: '{"paginationStartNo":{offset},"selectedCall":"sort","sortCriteria":{"name":"modifiedDate","isAscending":false},"anyOfTheseWords":""}'
      domain: "careers.hsc.com"
      companyId: "MTUzNjY="
    headers: {Accept: "application/json"}
    terms: [""]
    items: "data.data"
    fields:
      title: "_source.jobTitle"
      location: "_source.locationSeparatedbySlash"
      posted: "_source.jobCreatedDate"     # epoch milliseconds
      desc: "_source.mediumDescription"
    url_template: "https://careers.hsc.com/hsc/jobview/{_source.jobUrl}"
    page: {start: 0, step: 10, max: 5}   # {offset} = start + n*step

