# portals.yaml - har company ke OFFICIAL job portal ki recipe (job_checker.py isse padhta hai)
# ------------------------------------------------------------------------------------------
# Key = Excel ke "Company" column ka naam, bilkul same (spelling/brackets tak).
# Sab recipes 2026-11-13 ko ek baar live test ki gayi thi. Agar kisi company ka portal badal jaaye
# ("Blocked" / error aaye), us company ka careers page browser mein kholo aur yahan recipe update karo.
#
# Supported types:
#   workday        url: https://<tenant>.wdN.myworkdayjobs.com/<site>
#   eightfold      host, domain, mode (pcsx|v2), locations: [...]
#   smartrecruiters id      | lever id      | greenhouse id
#   oracle         host, site, [location_facet_id], [public_job_url]
#   talentbrew     url      (Radancy career sites, e.g. careers.arm.com)
#   avature        url, [terms], [offset_param], [per_page_param], [per_page], [list_filter_mode], [company_filter]
#   sf_csb         host, locationsearch          (SuccessFactors Career Site Builder)
#   sf_classic_xml url, url_template             (SuccessFactors classic XML feed)
#   jibe           host, location                (iCIMS Jibe)
#   csod           corp, site                    (Cornerstone OnDemand)
#   darwinbox      host
#   json_api       method, url, params/json/data, items, fields, url_template, page  (koi bhi JSON endpoint)
#   html_list      urls, link_pattern | item_regex, default_location, fetch_details
#   manual         url, note, [status]  -> script check nahi karta, sirf Portal Status mein note dikhata hai
#   same_as        "<other company>"   -> dusri company ka hi portal (jaise Ansys -> Synopsys)
#
# Nayi company add karni ho: Excel mein row daalo. Agar yahan recipe nahi hogi to script website se
# careers page khud dhoondhne ki koshish karega (Workday/Lever/Greenhouse/SmartRecruiters/Oracle pehchanta hai).

