    type: json_api
    method: GET
    url: "https://nagcareersite.table.core.windows.net/Main?sv=2019-02-02&spr=https%2Chttp&st=2023-09-26T11%3A18%3A20Z&se=2090-09-27T11%3A18%3A00Z&sp=r&sig=fvEYRZx0bQbrZxJIdob72MVhS5DTzT8q%2FvptRm8Y6yc%3D&tn=Main"
    headers: {Accept: "application/json;odata=nometadata"}
    terms: [""]
