  # portals_B.yaml - recipes for agent B's 14 companies (Delhi NCR embedded/firmware sweep)
  # All recipes were tested once with python requests on 2026-11-13 (see per-entry comments).
  # Conventions used below:
  #   items: ""  -> the JSON response root itself is the list of jobs.
  #   A per-entry `headers: {User-Agent: ...}` overrides the script's default UA (needed for Havells only).

  # verified 2026-11-13: Lever postings API returns 201 jobs (98 Noida); none embedded/firmware
  "Paytm": {type: lever, id: "paytm"}

  # verified 2026-11-13: the endpoint the careers page (pinelabs.com/careers/open-jobs) POSTs to; HTTP 200 JSON,
  # but it currently returns {"Total":0} for every body (page shows "No jobs found"). Item fields below come from
  # the page's own JS (JobId, JobTitle, Department, Location, JobType, ApplyUrl). Location may be a JSON string
  # like '[{"Address":"Noida, Uttar Pradesh, India"}]' - parse it if so. The site itself pages with Skip/Top=50;
  # a single call with Top=100 is used here because the {offset} placeholder would be inserted as a string.
  "Pine Labs":
    type: json_api
    method: POST
    url: "https://www.pinelabs.com/api/gateway/turbo-hire"
    json:
      Skip: 0
      Top: 100
      SortBy: "None"
      Filters: {Departments: [], Locations: [], JobTypes: [], SearchString: "{term}"}
      GetFiltersData: false
    headers: {Accept: "application/json", Content-Type: "application/json"}
    terms: [""]
    items: "Jobs"
    fields:
      title: "JobTitle"
      location: "Location"
      url: "ApplyUrl"

  # verified 2026-11-13: this is the careers page's own title search (it POSTs selectTitle; GET with the same param works too).
  # It returns [] because the page says "we don't have any job vacancies". IMPORTANT: from python-requests, a browser
  # User-Agent gets HTTP 406 here, while a plain UA ("job-checker/1.0" or the python-requests default) gets 200 JSON.
  # The search matches job titles only and needs at least 3 characters. Each item is {"position": "..."}. The site builds
  # the job link as career-opportunities/?position=<position>, so URL-encode it. The API gives no location field.
  "Havells":
    type: json_api
    method: GET
    url: "https://havells.com/job/index/search"
    params: {selectTitle: "{term}"}
    headers: {Accept: "application/json", User-Agent: "job-checker/1.0"}
    terms: ["embedded", "firmware"]
    items: ""
    fields:
      title: "position"
    url_template: "https://havells.com/corporate/careers/career-opportunities/?position={position}"

