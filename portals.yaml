    # extra: Avature keyword search also matches location text, so search by place names plus skill words.
    # URL = {url}/SearchJobs/{term}?folderOffset={n}. Page size is fixed at 6 (folderRecordsPerPage is ignored), so step
    # folderOffset by 6 until it passes "N results". Each result is <article class="article article--result ...">
